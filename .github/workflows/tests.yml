name: Tests

# Valide que le code Python tourne sur Linux (le poste de dev habituel est
# Windows) — pas de GPU sur ce runner, donc seul le chemin stt.device: cpu
# est réellement couvert, jamais stt.device: cuda (voir ARCHITECTURE.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # sounddevice (capture micro) a besoin de PortAudio au niveau système
      # sous Linux, pas juste du paquet pip.
      - name: Dépendance système audio (PortAudio)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # nvidia-cublas-cu12/nvidia-cudnn-cu12 ne servent qu'au GPU NVIDIA
      # (voir requirements.txt) — inutiles et lourds à télécharger ici.
      - name: Retire les paquets GPU NVIDIA de requirements.txt
        run: sed -i '/^nvidia-cublas-cu12/d;/^nvidia-cudnn-cu12/d' requirements.txt

      - name: Installe les dépendances
        run: pip install -r requirements.txt pytest

      - name: Lance les tests (serveur)
        run: pytest tests/ -v

      # server/ et satellite/ définissent chacun un module "config"/
      # "audio_io" : les lancer dans le même process pytest ferait
      # retourner le mauvais module à l'un des deux (sys.modules est un
      # cache global par nom d'import) — d'où deux invocations séparées.
      - name: Installe les dépendances (satellite)
        run: pip install -r satellite/requirements.txt

      - name: Lance les tests (satellite)
        run: pytest satellite/tests/ -v

  bump-version:
    name: Met à jour VERSION
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Historique complet requis : "git rev-list --count" sur un checkout
      # superficiel (défaut) ne compterait que le dernier commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # VERSION = MAJOR.nombre_de_commits, sur le modèle d'arcadepipe.
      # MAJOR ne bouge qu'à la main (vraie release) ; le nombre de commits
      # est le "mineur", recalculé à chaque push — approximatif par nature
      # (le commit de bump lui-même n'est recompté qu'au push suivant), mais
      # suffisant : launch.py ne fait qu'une comparaison différent/identique.
      - name: Calcule et applique la version
        env:
          MAJOR: "1"
        run: |
          echo "${MAJOR}.$(git rev-list --count HEAD)" > VERSION
          if ! git diff --quiet VERSION; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "VERSION -> $(cat VERSION) [skip ci]"
            git push
          fi
